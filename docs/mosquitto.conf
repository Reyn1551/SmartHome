# Konfigurasi Mosquitto untuk Smart Room (lab/demo).
#
# Listener 1883 dipakai ESP32 dan alat uji (mosquitto_pub/sub).
# Listener 9001 dipakai aplikasi React Native lewat MQTT over WebSocket.
#
# Jalankan:  mosquitto -c docs/mosquitto.conf -v
# Catatan:   allow_anonymous true HANYA untuk jaringan lab/demo. Jangan
#            pakai konfigurasi ini di jaringan publik atau produksi.

listener 1883
listener 9001
protocol websockets

allow_anonymous true

# Simpan pesan retain (status, state, counters, config) agar aplikasi yang
# baru tersambung langsung menerima nilai terakhir.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60

# Log singkat ke stdout saat dijalankan manual.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
